name: Trigger auto deployment for jump-jump-onlien

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/jump-jump-onlien-AutoDeployTrigger-d6acd304-ba92-4a65-b9b8-bbebb3f8893f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.JUMPJUMPONLIEN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.JUMPJUMPONLIEN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.JUMPJUMPONLIEN_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.JUMPJUMPONLIEN_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.JUMPJUMPONLIEN_REGISTRY_PASSWORD }}
          containerAppName: jump-jump-onlien
          resourceGroup: jump-jump-online
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


